<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a donation</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stats">
    <h2>Fundraising</h2>
    <p><span id="donorCount">-</span> donors</p>
    <p><span id="totalAmount">-</span>€ raised</p>
</div>

<form id="donationForm">
    <h1>Make a donation</h1>

    <div class="form-group">
        <label for="donorName">Name *</label>
        <input type="text" id="donorName" name="donorName" required>
    </div>

    <div class="form-group">
        <label for="donorEmail">Email *</label>
        <input type="email" id="donorEmail" name="donorEmail" required>
    </div>

    <div class="form-group">
        <label for="amount">Amount (€) *</label>
        <input type="number" id="amount" name="amount" min="1" step="0.01" required>
    </div>

    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
    </div>

    <div id="error" class="error"></div>
    <div class="loading" id="loading">Redirecting to PayPal...</div>

    <button type="submit">Donate via PayPal</button>
</form>

<script src="js/app.js"></script>
</body>
</html>
