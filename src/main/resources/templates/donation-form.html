<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a donation</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="container">
    <div class="stats-card">
        <div class="stats-header">
            <svg class="stats-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/>
            </svg>
            <h2>Fundraising Progress</h2>
        </div>
        <div class="stats-content">
            <div class="stat-item">
                <div class="stat-value" id="totalAmount">-</div>
                <div class="stat-label">€ raised</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value" id="donorCount">-</div>
                <div class="stat-label">donors</div>
            </div>
        </div>
    </div>

    <form id="donationForm" class="donation-form">
        <h1>Make a Donation</h1>
        <p class="form-subtitle">Support our cause with your generous contribution</p>

        <div class="form-group">
            <label for="donorName">Full Name *</label>
            <input type="text" id="donorName" name="donorName" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="donorEmail">Email Address *</label>
            <input type="email" id="donorEmail" name="donorEmail" placeholder="john.doe@example.com" required>
        </div>

        <div class="form-group">
            <label for="amount">Donation Amount *</label>
            <div class="amount-options">
                <button type="button" class="amount-btn" data-amount="10">10€</button>
                <button type="button" class="amount-btn" data-amount="25">25€</button>
                <button type="button" class="amount-btn" data-amount="50">50€</button>
                <button type="button" class="amount-btn" data-amount="100">100€</button>
            </div>
            <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Or enter custom amount" required>
        </div>

        <div class="form-group">
            <label for="message">Message (Optional)</label>
            <textarea id="message" name="message" placeholder="Leave a message of support..."></textarea>
        </div>

        <div id="error" class="error"></div>
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            Redirecting to PayPal...
        </div>

        <button type="submit" class="submit-btn">
            <svg class="paypal-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.067 8.478c.492.88.556 2.014.3 3.327-.74 3.806-3.276 5.12-6.514 5.12h-.5a.805.805 0 00-.794.68l-.04.22-.63 3.993-.03.17a.804.804 0 01-.794.68H7.72a.483.483 0 01-.477-.558l1.677-10.619a.964.964 0 01.952-.814h.692c2.237 0 4.228-.805 5.547-2.606.742-1.013 1.172-2.234 1.172-3.544 0-.332-.03-.657-.088-.972a4.01 4.01 0 00-.17-.677c.503.119.96.293 1.361.532.652.387 1.151.908 1.462 1.518z" fill="currentColor"/>
            </svg>
            Donate via PayPal
        </button>

        <div class="secure-notice">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
            </svg>
            Secure payment processed by PayPal
        </div>
    </form>
</div>

<script src="js/app.js"></script>
<script>
// Handle quick amount selection
document.querySelectorAll('.amount-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('amount').value = this.dataset.amount;
    });
});

// Clear active state when typing custom amount
document.getElementById('amount').addEventListener('input', function() {
    if (this.value) {
        document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
    }
});
</script>
</body>
</html>
